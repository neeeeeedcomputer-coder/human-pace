[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "human-pace"
version = "0.1.0"
description = "Decide when to reply based on how the person actually types."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "human-pace contributors" }]
keywords = ["chatbot", "typing", "latency", "conversation", "debounce"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/yourname/human-pace"
Issues = "https://github.com/yourname/human-pace/issues"

[tool.setuptools]
packages = ["human_pace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
